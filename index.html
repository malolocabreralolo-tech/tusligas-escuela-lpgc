<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Liga Escolar · Las Palmas</title>
  <meta name="description" content="Miniprebenjamín y Prebenjamín 2025/2026 – Las Palmas de Gran Canaria"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <nav class="nav">
    <div class="nav-mark">⚽</div>
    <div class="nav-copy"><b>Liga <span class="gtext">Escolar</span> Las Palmas</b><small id="nav-season">Temporada 2025 / 2026</small></div>
    <div class="nav-pills">
      <button class="npill mini" onclick="showLeague('mini')">Miniprebenjamín</button>
      <button class="npill pre" onclick="showLeague('pre')">Prebenjamín</button>
      <button class="npill hur on" onclick="showLeague('huracan')">Huracán</button>
    </div>
  </nav>

  <div class="page">
    <main class="main">
      <section class="lsec" id="sec-mini">
        <div class="lhdr mini">
          <div class="lhdr-ico">🔵</div>
          <div><h2>Miniprebenjamín Escuela</h2><small id="lhdr-mini-meta">—</small></div>
          <div class="badge-live">Activo</div>
        </div>
        <div class="itabs mini">
          <button class="itab mini on" onclick="switchTab('mini','cal',this)">Calendario</button>
          <button class="itab mini" onclick="switchTab('mini','eq',this)">Equipos</button>
        </div>
        <div class="panel on" id="mini-cal">
          <div class="pbox mini">
            <div class="jnav">
              <button class="jarr" id="mini-prev" onclick="chJorn('mini',-1)">‹</button>
              <select id="mini-sel" onchange="renderJornada('mini',+this.value)"></select>
              <button class="jarr" id="mini-next" onclick="chJorn('mini',1)">›</button>
            </div>
            <div class="jmeta" id="mini-meta"></div>
            <div id="mini-matches"></div>
          </div>
        </div>
        <div class="panel" id="mini-eq"><div class="pbox mini"><div class="tgrid" id="mini-teams"></div></div></div>
      </section>

      <section class="lsec" id="sec-pre">
        <div class="lhdr pre">
          <div class="lhdr-ico">🟡</div>
          <div><h2>Prebenjamín Escuela</h2><small id="lhdr-pre-meta">—</small></div>
          <div class="badge-live">Activo</div>
        </div>
        <div class="itabs pre">
          <button class="itab pre on" onclick="switchTab('pre','cal',this)">Calendario</button>
          <button class="itab pre" onclick="switchTab('pre','eq',this)">Equipos</button>
        </div>
        <div class="panel on" id="pre-cal">
          <div class="pbox pre">
            <div class="gfrow">
              <button class="gfbtn" id="gA" onclick="switchGrp('A')">Grupo A</button>
              <button class="gfbtn on-b" id="gB" onclick="switchGrp('B')">Grupo B</button>
            </div>
            <div class="jnav">
              <button class="jarr" id="pre-prev" onclick="chJorn('pre',-1)">‹</button>
              <select id="pre-sel" onchange="renderJornada('pre',+this.value)"></select>
              <button class="jarr" id="pre-next" onclick="chJorn('pre',1)">›</button>
            </div>
            <div class="jmeta" id="pre-meta"></div>
            <div id="pre-matches"></div>
          </div>
        </div>
        <div class="panel" id="pre-eq"><div class="pbox pre"><div class="tgrid" id="pre-teams"></div></div></div>
      </section>

      <section class="lsec on" id="sec-huracan">
        <div class="lhdr hur">
          <div class="lhdr-ico">🔴</div>
          <div><h2>AD Huracán · Miniprebenjamín</h2><small id="lhdr-hur-meta">—</small></div>
          <div class="badge-live">Seguimiento</div>
        </div>
        <div class="pbox hur">
          <div class="hur-next-wrap">
            <div class="hur-section-title">Próximo partido</div>
            <div id="hur-next"></div>
          </div>
          <div class="hur-current-wrap">
            <div class="hur-section-head">
              <div class="hur-section-title" id="hur-current-title">Próximos partidos</div>
              <button type="button" class="hur-full-toggle" id="hur-full-toggle" onclick="toggleFull()">
                <span id="hur-full-toggle-label">Ver calendario completo</span>
              </button>
            </div>
            <div id="hur-current"></div>
            <div id="hur-list" class="hur-full-hidden"></div>
          </div>
        </div>
      </section>

      <div class="footer-note">Static site · GitHub Pages · datos externos JSON · panel rápido del Huracán</div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
