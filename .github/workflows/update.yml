name: Auto-update match data

on:
  schedule:
    - cron: '0 8,12,16,20 * * *'   # 8h, 12h, 16h, 20h UTC (horario diurno Canarias)
  workflow_dispatch:
    inputs:
      telegram_test:
        description: 'Enviar mensaje de prueba a Telegram'
        type: boolean
        required: false
        default: false
      telegram_sample:
        description: 'Enviar ejemplo de alerta realista a Telegram'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      WATCH_HURACAN_MINI: 'true'
      WATCH_HURACAN_PRE: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh data and regenerate index.html
        run: python scripts/generate.py

      - name: Check Huracán matches and notify on changes
        continue-on-error: true
        run: |
          if [ "${{ inputs.telegram_test }}" = "true" ]; then
            python scripts/notify_huracan.py --test
          elif [ "${{ inputs.telegram_sample }}" = "true" ]; then
            python scripts/notify_huracan.py --sample
          else
            python scripts/notify_huracan.py
          fi

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add index.html styles.css app.js data/ scripts/snapshots/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update match data $(date '+%d/%m/%Y %H:%M UTC')"
            git push
          fi
